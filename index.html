<!DOCTYPE html>
<html lang="fil-PH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO Solar PV Design — Dark Mode Fixed</title>
    <style>
        :root {
            --primary: #0F4C75; --secondary: #10B981; --accent: #3B82F6;
            --bg-main: linear-gradient(135deg, #F0F4F8, #E6F0F5);
            --bg-card: #FFFFFF; --bg-alt: #F8FAFC;
            --text-main: #334155; --text-strong: #0F172A;
            --border: #E2E8F0; --shadow: rgba(15,76,117,0.08);
            --header-grad: linear-gradient(90deg, #0F4C75, #136397);
            --toggle-icon: '🌙';
        }

        [data-theme="dark"] {
            --primary: #60A5FA; --secondary: #34D399; --accent: #60A5FA;
            --bg-main: linear-gradient(135deg, #0F172A, #1E293B);
            --bg-card: #1E293B; --bg-alt: #334155;
            --text-main: #E2E8F0; --text-strong: #F8FAFC;
            --border: #475569; --shadow: rgba(0,0,0,0.3);
            --header-grad: linear-gradient(90deg, #1E40AF, #1E3A8A);
            --toggle-icon: '☀️';
        }

        *{box-sizing:border-box; font-family: 'Segoe UI', sans-serif; margin:0; padding:0;}
        body{background:var(--bg-main); min-height:100vh; padding:16px; max-width:1200px; margin:0 auto; color:var(--text-main); line-height:1.6; transition: background 0.3s ease, color 0.3s ease;}
        
        .theme-toggle{position:fixed; top:16px; right:16px; z-index:999; background:var(--bg-card); border:2px solid var(--border); border-radius:50%; width:44px; height:44px; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px var(--shadow); transition:all 0.2s ease;}
        .theme-toggle:hover{transform:scale(1.1);}
        .theme-toggle::before{content:var(--toggle-icon);}
        
        .header-bar{background:var(--header-grad); color:white; padding:20px; border-radius:12px; margin-bottom:20px;}
        .card{background:var(--bg-card); border-radius:12px; padding:20px; margin-bottom:20px; border:1px solid var(--border); transition:background 0.3s ease;}
    </style>
</head>
<body>

<!-- DARK MODE BUTTON -->
<button class="theme-toggle" id="themeBtn" title="Toggle Dark/Light Mode"></button>

<div class="header-bar">
    <h1>☀️ Solar PV System Design</h1>
    <p>Dark Mode — Click the 🌙 button on top right!</p>
</div>

<div class="card">
    <h2>Test Dark Mode</h2>
    <p>Kapag pinindot mo ang moon icon sa kanan sa taas, dapat magbago ang kulay ng pahina!</p>
    <p id="status">Current Mode: <strong>Light Mode</strong></p>
</div>

<script>
// ========== DARK MODE — GUMAGANA NA! ==========
const htmlEl = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
const statusEl = document.getElementById('status');

function getSystemTheme() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function setTheme(theme, save = true) {
    if (theme === 'dark') {
        htmlEl.setAttribute('data-theme', 'dark');
        statusEl.innerHTML = 'Current Mode: <strong style="color:#60A5FA">Dark Mode ☀️</strong> — Click to switch to Light';
    } else {
        htmlEl.removeAttribute('data-theme');
        statusEl.innerHTML = 'Current Mode: <strong style="color:#0F4C75">Light Mode 🌙</strong> — Click to switch to Dark';
    }
    if (save) localStorage.setItem('theme', theme);
}

function toggleTheme() {
    const current = htmlEl.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    setTheme(current === 'dark' ? 'light' : 'dark');
}

// INITIALIZE — GUMAGANA AGAD!
const saved = localStorage.getItem('theme');
setTheme(saved || getSystemTheme(), false);
themeBtn.addEventListener('click', toggleTheme);

console.log("✅ Dark Mode script loaded!");
</script>

</body>
</html>
